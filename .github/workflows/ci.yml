name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar backend
        working-directory: backend
        run: npm ci
      - name: Instalar frontend
        working-directory: frontend
        run: npm ci
      - name: Validar Prisma
        working-directory: backend
        run: npm run prisma:validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/caixafacil
      - name: Lint backend
        working-directory: backend
        run: npm run lint
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Test backend
        working-directory: backend
        run: npm test
      - name: Test frontend
        working-directory: frontend
        run: npm test
